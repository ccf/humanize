[project]
name = "humanize-plugin"
version = "0.3.1"
description = "Agent skill that audits prose for AI tells and rewrites it in the author's voice, on evidence from 13 studies."
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=4",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["data", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
